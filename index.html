<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão Inteligente de Contactos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📇 Gestão de Contactos</h1>
    <p class="subtitle">Registe, fotografe e pesquise os seus contactos</p>
  </header>

  <main>
    <!-- Secção de Captura -->
    <section class="card">
      <h2>1. Adicionar Cartão de Visita</h2>
      
      <div class="buttons" style="margin-bottom: 1rem;">
        <button id="startCamera" class="btn primary">📷 Ativar Câmara</button>
        <button id="stopCamera" class="btn secondary" style="display:none;">⏹ Parar Câmara</button>
        <button id="captureBtn" class="btn success" style="display:none;">📸 Tirar Fotografia</button>
        
        <!-- Botão para carregar imagem -->
        <label class="btn primary" style="cursor: pointer; display: inline-block;">
          🖼️ Carregar Imagem
          <input type="file" id="uploadInput" accept="image/*" style="display: none;">
        </label>
      </div>

      <div class="camera-area">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" alt="Pré-visualização" />
      </div>
      
      <p id="ocrStatus" class="status"></p>
      
      <!-- Caixa de texto em bruto (Debug) -->
      <div id="rawTextContainer" style="display:none; margin-top: 1rem;">
        <label style="font-size: 0.9rem; color: #374151; font-weight: 600;">Texto Lido:</label>
        <textarea id="rawTextOutput" rows="5" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 0.25rem; font-family: monospace; font-size: 0.85rem; background: #f9fafb;"></textarea>
      </div>
    </section>

    <!-- Formulário -->
    <section class="card">
      <h2>2. Dados do Contacto</h2>
      <form id="contactForm">
        <input type="hidden" name="id" />
        <label>Nome *<input name="name" required placeholder="Nome completo" /></label>
        <label>Empresa<input name="company" placeholder="Empresa" /></label>
        <label>Telefone<input name="phone" type="tel" placeholder="+351 ..." /></label>
        <label>Email<input name="email" type="email" placeholder="nome@empresa.pt" /></label>
        <div class="buttons">
          <button type="submit" class="btn success">💾 Guardar Contacto</button>
          <button type="button" id="clearForm" class="btn secondary">Limpar</button>
        </div>
      </form>
    </section>

    <!-- Pesquisa e lista -->
    <section class="card">
      <h2>3. Contactos Guardados</h2>
      <input id="searchInput" type="search" placeholder="🔍 Pesquisar por nome ou empresa..." class="search" />
      <ul id="contactList" class="contact-list"></ul>
    </section>
  </main>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App -->
  <script src="app.js"></script>
</body>
</html>
