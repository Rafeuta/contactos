<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão Inteligente de Contactos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📇 Gestão de Contactos</h1>
    <p class="subtitle">Registe, fotografe e pesquise os seus contactos</p>
  </header>

  <main>
    <section class="card">
      <h2>1. Adicionar Cartão de Visita</h2>
      
      <div class="buttons" style="margin-bottom: 1rem;">
        <button id="startCamera" class="btn primary">📷 Ativar Câmara</button>
        <button id="stopCamera" class="btn secondary" style="display:none;">⏹ Parar Câmara</button>
        <button id="captureBtn" class="btn success" style="display:none;">📸 Tirar Fotografia</button>
        
        <label class="btn primary" style="cursor: pointer; display: inline-block;" for="uploadInput">
          🖼️ Carregar Imagem
          <input type="file" id="uploadInput" accept="image/*" style="display: none;">
        </label>
      </div>

      <div class="camera-area">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" alt="Pré-visualização da imagem capturada" />
      </div>
      
      <p id="ocrStatus" class="status" role="status" aria-live="polite"></p>
      
      <div id="rawTextContainer" style="display:none; margin-top: 1rem;">
        <label for="rawTextOutput" style="font-size: 0.9rem; color: #374151; font-weight: 600;">Texto Lido (podes copiar daqui):</label>
        <textarea id="rawTextOutput" rows="6" style="width: 100%; padding: 0.5rem; border: 1px solid #6b7280; border-radius: 8px; margin-top: 0.25rem; font-family: monospace; font-size: 0.9rem;"></textarea>
      </div>
    </section>

    <section class="card">
      <h2>2. Dados do Contacto</h2>
      <form id="contactForm">
        <input type="hidden" name="id" />
        
        <div class="form-group">
          <label for="contactType">Tipo de Contacto</label>
          <select id="contactType" name="type" required>
            <option value="Potencial Cliente">Potencial Cliente</option>
            <option value="Cliente">Cliente</option>
            <option value="Fornecedor">Fornecedor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="contactName">Nome *</label>
          <input id="contactName" name="name" required placeholder="Ex: João Silva" />
        </div>

        <div class="form-group">
          <label for="contactCompany">Empresa</label>
          <input id="contactCompany" name="company" placeholder="Ex: Empresa Lda." />
        </div>

        <div class="form-group">
          <label for="contactPhone">Telefone</label>
          <input id="contactPhone" name="phone" type="tel" placeholder="Ex: +351 912 345 678" />
        </div>

        <div class="form-group">
          <label for="contactEmail">Email</label>
          <input id="contactEmail" name="email" type="email" placeholder="Ex: nome@empresa.pt" />
        </div>
        
        <div class="buttons">
          <button type="submit" class="btn success">💾 Guardar Contacto</button>
          <button type="button" id="clearForm" class="btn secondary">Limpar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>3. Contactos Guardados</h2>
      
      <div class="search-bar">
        <input id="searchInput" type="search" placeholder="🔍 Pesquisar por nome ou empresa..." class="search" />
        <select id="filterInput" aria-label="Filtrar por tipo de contacto">
          <option value="">Todos os tipos</option>
          <option value="Potencial Cliente">Potencial Cliente</option>
          <option value="Cliente">Cliente</option>
          <option value="Fornecedor">Fornecedor</option>
        </select>
      </div>

      <ul id="contactList" class="contact-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
